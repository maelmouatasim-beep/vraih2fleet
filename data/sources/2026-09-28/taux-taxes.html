        :root {
            --bg-color: #f5f5f5;
            --text-color: #4b4b4b;
            --accent-color: #015c87;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%; /* 1rem = 10px */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
        }

        body, code {
            font-size: 1.4rem; /* 14px */
            line-height: 2.2rem;
            font-family: 'Roboto', sans-serif;
            color: var(--text-color);
        }

        /* Centrage vertical et horizontal accessible sans bloquer le zoom */
        div.overlay {
            display: flex;
            justify-content:center;
            align-items:flex-start;
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        main.conteneur {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
            max-width: 89.4rem; /* Largeur maximale gérée ici */
        }

        main.conteneur section.message-erreur {
            background: var(--card-bg);
            border-radius: 8px;
            width: 100%;
            padding: 3.2rem 2.4rem;
            display: flex;
            flex-direction: column;
            gap: 4rem;

            @media (min-width: 768px) {
