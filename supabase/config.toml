project_id = "fihklznbfufhowopwwuc"

# Règle : verify_jwt n'est PAS une authentification (la clé anon publique
# suffit à le franchir). Chaque fonction vérifie explicitement son appelant
# dans son code (_shared/auth.ts) : JWT réel (getUserOrThrow), secret cron
# (requireCronSecret) ou secret interne (requireInternalSecret).

[functions.authenticate-telematics]
verify_jwt = true

[functions.fetch-telematics-vehicles]
verify_jwt = true

[functions.get-mapbox-token]
verify_jwt = true

[functions.assistant-chat]
verify_jwt = true

# Gabarits publics (rate limit + pot de miel) et internes (secrets) : la
# fonction fait le tri elle-même.
[functions.send-email]
verify_jwt = false

# Appelée uniquement par pg_cron avec x-cron-secret.
[functions.notify-subsidy-deadlines]
verify_jwt = false

# Mode cron (x-cron-secret) ou mode utilisateur (JWT vérifié dans le code).
[functions.sync-telematics-data]
verify_jwt = false

# API publique reportée : 404 tant que FEATURE_PUBLIC_API n'est pas "true".
[functions.api-gateway]
verify_jwt = false

[functions.mcp]
verify_jwt = false
