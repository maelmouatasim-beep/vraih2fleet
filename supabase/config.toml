project_id = "fihklznbfufhowopwwuc"

# Supabase LOCAL uniquement (supabase start) : URLs autorisées pour les
# liens des courriels d'auth (serveur de dev 8080, build GitHub Pages
# servi en local sous /vraih2fleet/ sur 4173). Le projet hébergé se règle
# dans le tableau de bord (voir docs/deploiement.md), pas ici.
[auth]
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://127.0.0.1:8080/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:4173/**",
]

# Règle : verify_jwt n'est PAS une authentification (la clé anon publique
# suffit à le franchir). Chaque fonction vérifie explicitement son appelant
# dans son code (_shared/auth.ts) : JWT réel (getUserOrThrow), secret cron
# (requireCronSecret) ou secret interne (requireInternalSecret).

[functions.authenticate-telematics]
verify_jwt = true

[functions.fetch-telematics-vehicles]
verify_jwt = true

[functions.get-mapbox-token]
verify_jwt = true

# Copilote de projet (Phase 5.2) : JWT vérifié dans le code (getUserOrThrow).
[functions.copilot]
verify_jwt = true

# Import intelligent de flotte (Phase 5.3) : JWT vérifié dans le code.
[functions.fleet-import]
verify_jwt = true

# Lecture de factures et devis (Phase 5.4) : JWT vérifié dans le code.
[functions.document-reader]
verify_jwt = true

# Phase 5.7 — note au conseil (JWT vérifié dans le code, projet relu avec RLS).
[functions.council-note]
verify_jwt = true

# Gabarits publics (rate limit + pot de miel) et internes (secrets) : la
# fonction fait le tri elle-même.
[functions.send-email]
verify_jwt = false

# Appelée uniquement par pg_cron avec x-cron-secret.
[functions.notify-subsidy-deadlines]
verify_jwt = false

# Phase 5.6 — résumé des alertes de surveillance (x-cron-secret vérifié dans le code).
[functions.plan-alerts-digest]
verify_jwt = false

# Mode cron (x-cron-secret) ou mode utilisateur (JWT vérifié dans le code).
[functions.sync-telematics-data]
verify_jwt = false

# API publique reportée : 404 tant que FEATURE_PUBLIC_API n'est pas "true".
[functions.api-gateway]
verify_jwt = false

[functions.mcp]
verify_jwt = false
