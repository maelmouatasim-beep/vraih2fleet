name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Dépôt PRIVÉ : le job lourd (Supabase local + e2e, ~15 min) ne tourne
  # plus à chaque push (2 000 min/mois gratuites) — chaque nuit, à la main
  # et sur la branche production à la place (voir docs/production.md).
  schedule:
    - cron: "17 7 * * *"

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint en mode baseline : échoue seulement sur les erreurs nouvelles
      # par rapport à scripts/lint-baseline.json (dette existante assumée).
      - name: Lint (baseline)
        run: npm run lint:ci

      # Test du nettoyage de l'historique git (dépôt factice) : requiert
      # git-filter-repo, sinon le test est ignoré.
      - name: git-filter-repo (test du nettoyage d'historique)
        run: pipx install git-filter-repo==2.47.0

      - name: Tests unitaires
        run: npm run test

      - name: Couverture du moteur TCO (seuils 95 %)
        run: npm run test:tco

      - name: Constantes d'hypothèses hors src/lib/tco (baseline)
        run: node scripts/check-hypothesis-constants.mjs

      - name: Cas de référence — JSON conforme au contre-calculateur indépendant
        run: node scripts/reference-cases/generate.mjs --check

      - name: Build
        run: npm run build

  supabase:
    if: >-
      ${{ !github.event.repository.private || github.event_name != 'push'
          || github.ref == 'refs/heads/production' }}
    name: Edge functions + audit RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Typecheck des edge functions
        working-directory: supabase/functions
        env:
          SUPABASE_ANON_KEY: check-only
          SUPABASE_SERVICE_ROLE_KEY: check-only
        run: |
          deno check --node-modules-dir=none \
            _shared/cors.ts _shared/auth.ts _shared/validation.ts \
            send-email/index.ts notify-subsidy-deadlines/index.ts plan-alerts-digest/index.ts \
            sync-telematics-data/index.ts \
            copilot/index.ts _shared/ai.ts fleet-import/index.ts document-reader/index.ts council-note/index.ts \
            authenticate-telematics/index.ts \
            fetch-telematics-vehicles/index.ts api-gateway/index.ts \
            get-mapbox-token/index.ts

      # Démarre Postgres + Auth + PostgREST et applique toutes les migrations.
      - name: Démarrer Supabase local
        run: supabase start

      # Le manifeste du schéma (tables + RLS, policies, fonctions, triggers)
      # doit refléter exactement les migrations : c'est la référence du
      # contrôle de santé de la base hébergée (workflow Deploy Supabase).
      - name: Schéma conforme au manifeste (supabase/schema-attendu.json)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_DB_URL="$DB_URL" node scripts/verifier-base.mjs --local

      - name: Servir les edge functions (env de test, jamais la production)
        run: |
          supabase functions serve --env-file supabase/tests/functions.env &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:54321/functions/v1/send-email || echo 000)
            case "$code" in
              000|502|503) sleep 2 ;;
              *) echo "edge runtime prêt (HTTP $code)"; break ;;
            esac
          done

      - name: Tests d'intégration (fonctions + audit RLS)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_DB_URL="$DB_URL"
          deno test --allow-net --allow-env --allow-read --node-modules-dir=none \
            supabase/tests/ supabase/functions/

      # Cas du TEST TERRAIN (12 véhicules, 3 garages) de bout en bout contre
      # ce Supabase local : totaux identiques Stratégies / Plan / Financement
      # / PDF / Excel, libellé de la stratégie retenue, état des étapes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Parcours e2e du cas terrain (12 véhicules, 3 garages)
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npx playwright install --with-deps chromium
          eval "$(supabase status -o env | sed 's/^/export /')"
          # Copilote : fonctions relancées avec un FAUX serveur Claude scripté
          # (aucune vraie clé en CI) ; courriels : FAUX serveur SMTP (TLS
          # implicite comme le port 465 d'IONOS) dont l'AC de test est ajoutée
          # à l'environnement des fonctions.
          pkill -f "supabase functions serve" || true
          node scripts/mock-anthropic.mjs 35563 &
          MOCK_SMTP_ENV_OUT=smtp-ca.env node scripts/mock-smtp.mjs 2465 &
          for i in $(seq 1 30); do [ -s smtp-ca.env ] && break; sleep 1; done
          cat supabase/tests/functions-e2e.env smtp-ca.env > functions-e2e-ci.env
          supabase functions serve --env-file functions-e2e-ci.env &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/copilot || echo 000)
            case "$code" in 000|502|503) sleep 2 ;; *) break ;; esac
          done
          # Envoi RÉEL par SMTP (statut, courriel de test admin, invitation,
          # mot de passe refusé) contre le faux serveur.
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_DB_URL="$DB_URL" \
            MOCK_SMTP_HTTP=http://127.0.0.1:2466 \
            deno test --allow-net --allow-env --allow-read --node-modules-dir=none supabase/tests/smtp-envoi.test.ts
          # BUNDLE DE PRODUCTION (BrowserRouter) servi comme Cloudflare Pages :
          # en-têtes de dist/_headers (CSP stricte — une violation fait échouer
          # le parcours), redirections 301 de dist/_redirects, repli SPA.
          VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
            npx vite build --outDir dist-prod
          node scripts/serveur-production.mjs 8080 dist-prod &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -sI http://127.0.0.1:8080/dashboard/projects | grep -qi "^content-security-policy:" || { echo "::error::CSP absente du bundle de production"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8080/ecosystem)" = "301 http://127.0.0.1:8080/features" || { echo "::error::redirection 301 absente"; exit 1; }
          node scripts/e2e-terrain.mjs e2e-terrain
          # Recalcul planifié côté serveur (même code que l'écran) sur le
          # projet du parcours : aucune alerte nouvelle ni résolue.
          PROJET=$(psql "$DB_URL" -tAc "select id from public.projects order by created_at desc limit 1")
          node scripts/alertes/recalcul-alertes.mjs --local --projet "$PROJET" --verifier-aucun-changement

      # Confirmation du courriel : 4 scénarios + anti-énumération, en URL
      # propres (bundle de production) ET en routage par hash (GitHub Pages).
      - name: Parcours de confirmation du courriel (URL propres + hash)
        if: ${{ !cancelled() }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          if ! curl -sf http://127.0.0.1:8080/ >/dev/null; then
            [ -f dist-prod/index.html ] || VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
              npx vite build --outDir dist-prod
            node scripts/serveur-production.mjs 8080 dist-prod &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          fi
          node scripts/e2e-confirmation.mjs
          VITE_PREVIEW_HASH_ROUTER=true VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
            npx vite build --base=/vraih2fleet/ --outDir site-hash/vraih2fleet
          node scripts/serveur-production.mjs 4173 site-hash &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/vraih2fleet/ >/dev/null && break; sleep 1; done
          E2E_BASE=http://127.0.0.1:4173/vraih2fleet E2E_HASH=1 node scripts/e2e-confirmation.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-terrain
          path: e2e-terrain/
          retention-days: 7

      # Régression visuelle : toutes les pages principales avec la démo
      # « Ville de Rivière-Claire », en 1440 / 1024 / 390 px, fr et en.
      # Échoue sur débordement horizontal, texte coupé, mot coupé, chiffres
      # non alignés, bouton hors de sa carte, clé de traduction ou erreur JS.
      - name: Régression visuelle (toutes les pages, 3 largeurs, fr/en)
        if: ${{ !cancelled() }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          if ! curl -sf http://127.0.0.1:8080/ >/dev/null; then
            [ -f dist-prod/index.html ] || VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
              npx vite build --outDir dist-prod
            node scripts/serveur-production.mjs 8080 dist-prod &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          fi
          node scripts/e2e-visuel.mjs e2e-visuel

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-visuel
          path: e2e-visuel/
          retention-days: 7
