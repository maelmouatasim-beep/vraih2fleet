name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint en mode baseline : échoue seulement sur les erreurs nouvelles
      # par rapport à scripts/lint-baseline.json (dette existante assumée).
      - name: Lint (baseline)
        run: npm run lint:ci

      - name: Tests unitaires
        run: npm run test

      - name: Couverture du moteur TCO (seuils 95 %)
        run: npm run test:tco

      - name: Constantes d'hypothèses hors src/lib/tco (baseline)
        run: node scripts/check-hypothesis-constants.mjs

      - name: Cas de référence — JSON conforme au contre-calculateur indépendant
        run: node scripts/reference-cases/generate.mjs --check

      - name: Build
        run: npm run build

  supabase:
    name: Edge functions + audit RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Typecheck des edge functions
        working-directory: supabase/functions
        env:
          SUPABASE_ANON_KEY: check-only
          SUPABASE_SERVICE_ROLE_KEY: check-only
        run: |
          deno check --node-modules-dir=none \
            _shared/cors.ts _shared/auth.ts _shared/validation.ts \
            send-email/index.ts notify-subsidy-deadlines/index.ts plan-alerts-digest/index.ts \
            sync-telematics-data/index.ts \
            copilot/index.ts _shared/ai.ts fleet-import/index.ts document-reader/index.ts council-note/index.ts \
            authenticate-telematics/index.ts \
            fetch-telematics-vehicles/index.ts api-gateway/index.ts \
            get-mapbox-token/index.ts

      # Démarre Postgres + Auth + PostgREST et applique toutes les migrations.
      - name: Démarrer Supabase local
        run: supabase start

      # Le manifeste du schéma (tables + RLS, policies, fonctions, triggers)
      # doit refléter exactement les migrations : c'est la référence du
      # contrôle de santé de la base hébergée (workflow Deploy Supabase).
      - name: Schéma conforme au manifeste (supabase/schema-attendu.json)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          SUPABASE_DB_URL="$DB_URL" node scripts/verifier-base.mjs --local

      - name: Servir les edge functions (env de test, jamais la production)
        run: |
          supabase functions serve --env-file supabase/tests/functions.env &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:54321/functions/v1/send-email || echo 000)
            case "$code" in
              000|502|503) sleep 2 ;;
              *) echo "edge runtime prêt (HTTP $code)"; break ;;
            esac
          done

      - name: Tests d'intégration (fonctions + audit RLS)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_DB_URL="$DB_URL"
          deno test --allow-net --allow-env --allow-read --node-modules-dir=none \
            supabase/tests/ supabase/functions/

      # Cas du TEST TERRAIN (12 véhicules, 3 garages) de bout en bout contre
      # ce Supabase local : totaux identiques Stratégies / Plan / Financement
      # / PDF / Excel, libellé de la stratégie retenue, état des étapes.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Parcours e2e du cas terrain (12 véhicules, 3 garages)
        run: |
          npm ci
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npx playwright install --with-deps chromium
          eval "$(supabase status -o env | sed 's/^/export /')"
          # Copilote : fonctions relancées avec un FAUX serveur Claude scripté
          # (aucune vraie clé en CI).
          pkill -f "supabase functions serve" || true
          node scripts/mock-anthropic.mjs 35563 &
          supabase functions serve --env-file supabase/tests/functions-e2e.env &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/copilot || echo 000)
            case "$code" in 000|502|503) sleep 2 ;; *) break ;; esac
          done
          VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
            npx vite --port 8080 --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          node scripts/e2e-terrain.mjs e2e-terrain

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-terrain
          path: e2e-terrain/
          retention-days: 7

      # Régression visuelle : toutes les pages principales avec la démo
      # « Ville de Rivière-Claire », en 1440 / 1024 / 390 px, fr et en.
      # Échoue sur débordement horizontal, texte coupé, mot coupé, chiffres
      # non alignés, bouton hors de sa carte, clé de traduction ou erreur JS.
      - name: Régression visuelle (toutes les pages, 3 largeurs, fr/en)
        if: ${{ !cancelled() }}
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          if ! curl -sf http://127.0.0.1:8080/ >/dev/null; then
            VITE_SUPABASE_URL=http://127.0.0.1:54321 VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" VITE_SUPABASE_PROJECT_ID=local \
              npx vite --port 8080 --host 127.0.0.1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          fi
          node scripts/e2e-visuel.mjs e2e-visuel

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-visuel
          path: e2e-visuel/
          retention-days: 7
