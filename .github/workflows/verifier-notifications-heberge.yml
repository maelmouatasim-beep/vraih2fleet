name: Vérifier les notifications (base hébergée)

# Vérifie la cloche des notifications sur le site de TEST (projet Supabase
# hébergé) : deux comptes jetables e2e-…@example.com, démo « Ville de
# Rivière-Claire », tâches du plan générées, coéquipier qui commente et
# assigne une tâche (vrais triggers de la base), cloche ouverte avec
# plusieurs types, clic → étape Suivi, compteur à jour. Les comptes et leur
# organisation sont SUPPRIMÉS en fin de run, même en cas d'échec.
# Lancement manuel : Actions → Vérifier les notifications (base hébergée).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-heberge
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Configuration présente ?
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || { echo "::error::$v manquant (docs/deploiement.md)"; exit 1; }
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Créer les comptes de test
        run: node scripts/comptes-e2e.mjs creer

      - name: Cloche des notifications sur la démo Rivière-Claire
        run: node scripts/verifier-notifications-heberge.mjs verification-notifications

      - name: Supprimer les comptes de test
        if: always()
        run: node scripts/comptes-e2e.mjs supprimer

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-notifications
          path: verification-notifications/
          retention-days: 7
