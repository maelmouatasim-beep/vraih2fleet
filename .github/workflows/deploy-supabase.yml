name: Deploy Supabase

# Déploiement automatique du projet Supabase de TEST à chaque push :
# migrations (supabase db push), edge functions, puis contrôle de santé
# (scripts/verifier-base.mjs --heberge).
#
# Secrets du dépôt (Settings → Secrets and variables → Actions → Secrets),
# saisis par le propriétaire du dépôt — jamais dans le code ni le chat :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   mot de passe de la base du projet
#   SUPABASE_PROJECT_REF   ref du projet (20 caractères)
# Tant qu'ils ne sont pas définis, le workflow s'arrête proprement (avertissement).

on:
  push:
    branches: ["claude/code-integration-site-o88hza"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false # ne jamais interrompre une migration en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secrets configurés ?
        id: cfg
        run: |
          manquants=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!s}" ] || manquants="$manquants $s"
          done
          if [ -n "$manquants" ]; then
            echo "::warning::Déploiement Supabase ignoré — secrets manquants :$manquants (voir docs/deploiement.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest

      - name: Lier le projet
        if: steps.cfg.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations en attente (aperçu)
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      # Migrations additives uniquement (convention du dépôt) ; db push
      # s'arrête à la première erreur, chaque migration est une transaction.
      - name: Appliquer les migrations
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      # Toutes les fonctions de supabase/functions (les dossiers « _ » sont
      # ignorés) ; verify_jwt vient de supabase/config.toml.
      - name: Déployer les edge functions
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Contrôle de santé (schéma, fonctions, secrets, auth, cron)
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/verifier-base.mjs --heberge
