name: Deploy Supabase

# Déploiement automatique du projet Supabase de TEST à chaque push :
# migrations (supabase db push), edge functions, puis contrôle de santé
# (scripts/verifier-base.mjs --heberge).
#
# Secrets du dépôt (Settings → Secrets and variables → Actions → Secrets),
# saisis par le propriétaire du dépôt — jamais dans le code ni le chat :
#   SUPABASE_ACCESS_TOKEN  jeton personnel (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   mot de passe de la base du projet
#   SUPABASE_PROJECT_REF   ref du projet (20 caractères)
#   H2FLEET_ADMIN_EMAIL    (facultatif) adresse du compte à nommer
#                          administrateur H2Fleet, dont les organisations
#                          reçoivent les fonctions IA activées — lue
#                          seulement par scripts/admin-heberge.mjs, jamais
#                          écrite dans le dépôt ni les journaux
# Tant qu'ils ne sont pas définis, le workflow s'arrête proprement (avertissement).

on:
  push:
    branches: ["claude/code-integration-site-o88hza"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false # ne jamais interrompre une migration en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Secrets configurés ?
        id: cfg
        run: |
          manquants=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            [ -n "${!s}" ] || manquants="$manquants $s"
          done
          if [ -n "$manquants" ]; then
            echo "::warning::Déploiement Supabase ignoré — secrets manquants :$manquants (voir docs/deploiement.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest

      - name: Lier le projet
        if: steps.cfg.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations en attente (aperçu)
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      # Migrations additives uniquement (convention du dépôt) ; db push
      # s'arrête à la première erreur, chaque migration est une transaction.
      - name: Appliquer les migrations
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      # Toutes les fonctions de supabase/functions (les dossiers « _ » sont
      # ignorés) ; verify_jwt vient de supabase/config.toml.
      - name: Déployer les edge functions
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      # Fonctions retirées du dépôt (scripts/fonctions-retirees.json :
      # assistant-chat, calculate-tco) supprimées du projet si encore
      # déployées ; idempotent, jamais une fonction encore dans le dépôt.
      - name: Supprimer les fonctions retirées
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/supprimer-fonctions-retirees.mjs

      # Tâches pg_cron (rappels de subventions, synchro télématique, purge,
      # résumé des alertes) planifiées dès que les deux secrets du Vault
      # existent ; idempotent, aucune valeur lue (scripts/taches-cron.mjs).
      - name: Planifier les tâches pg_cron
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/taches-cron.mjs

      - name: Contrôle de santé (schéma, fonctions, secrets, auth, cron)
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/verifier-base.mjs --heberge

      # Idempotent (scripts/admin-heberge.mjs) : rôle admin H2Fleet +
      # copilote, import intelligent, factures et devis, note au conseil
      # activés pour les organisations du compte H2FLEET_ADMIN_EMAIL.
      # Sans ce secret : étape ignorée (avis).
      - name: Administrateur H2Fleet et fonctions IA
        if: steps.cfg.outputs.ok == 'true'
        env:
          H2FLEET_ADMIN_EMAIL: ${{ secrets.H2FLEET_ADMIN_EMAIL }}
        run: node scripts/admin-heberge.mjs
