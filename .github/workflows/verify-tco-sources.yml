# Outil de documentation : lit les sources officielles des hypothèses TCO
# (bloquées par le proxy de la sandbox de dev) et imprime des extraits dans
# les logs pour vérification humaine/agent. Aucun secret, lecture seule.
# Utilisé pour tenir à jour src/lib/tco/assumptions.ts (statut « vérifié »).
name: Vérification des sources TCO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Installer poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Écocamionnage — Tableau 2 complet (plafonds classes 3 à 8)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://www.quebec.ca/transports/aide-financiere/electrification/ecocamionnage/volet-1" -o eco.html
          PDF=$(grep -oE 'href="[^"]*[Mm]odalit[^"]*\.pdf[^"]*"' eco.html | head -1 | sed 's/href="//;s/"$//')
          case "$PDF" in http*) URL="$PDF";; *) URL="https://www.quebec.ca$PDF";; esac
          curl -sL --max-time 120 -o modalites.pdf "$URL"
          pdftotext -layout modalites.pdf modalites.txt || true
          echo "=== ECO TABLEAU 2 COMPLET ==="
          awk '/Tableau 2/{f=1} f{print NR": "$0} f&&/Tableau 3/{exit}' modalites.txt | head -90
          echo "=== ECO INFRASTRUCTURE RECHARGE ==="
          grep -n -i -B2 -A14 "borne\|recharge\|ravitaillement" modalites.txt | head -80

      - name: ECCC — intensité réseau Québec (grep direct)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://www.canada.ca/fr/services/environnement/meteo/changementsclimatiques/plan-climatique/electricite-propre/apercu-quebec.html" -o qcgrid.html
          python3 -c "import re,html;t=open('qcgrid.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>','',t,flags=re.S);t=re.sub(r'<style.*?</style>','',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'[ \t]+',' ',t);open('qcgrid.txt','w').write(t)"
          echo "=== QC GRID EXTRAITS ==="
          grep -o -E ".{300}(éq\. CO|intensité|émissions).{400}" qcgrid.txt | head -12

      - name: Guide QC quantification GES — facteurs routiers (annexe)
        continue-on-error: true
        run: |
          curl -sL --max-time 180 -o guide.pdf "https://www.environnement.gouv.qc.ca/changements/ges/guide-quantification/guide-quantification-ges.pdf"
          pdftotext -layout guide.pdf guide.txt || true
          echo "=== GUIDE QC 2,68 ==="
          grep -n -B6 -A10 "2 681\|2,681\|2681" guide.txt | head -120
          echo "=== GUIDE QC TABLEAU VEHICULES ROUTIERS ==="
          grep -n -i -B4 -A30 "véhicules automobiles à moteur diesel\|routier.*diesel.*facteur\|facteurs d.émission.*routier" guide.txt | head -140
