# Outil de documentation : lit les sources officielles des hypothèses TCO
# (bloquées par le proxy de la sandbox de dev) et imprime des extraits dans
# les logs pour vérification humaine/agent. Aucun secret, lecture seule.
# Utilisé pour tenir à jour src/lib/tco/assumptions.ts (statut « vérifié »).
name: Vérification des sources TCO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Installer poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Écocamionnage — modalités d'application (montants 6.1.5)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://www.quebec.ca/transports/aide-financiere/electrification/ecocamionnage/volet-1" -o eco.html
          PDF=$(grep -oE 'href="[^"]*[Mm]odalit[^"]*\.pdf[^"]*"' eco.html | head -1 | sed 's/href="//;s/"$//')
          echo "PDF URL: $PDF"
          case "$PDF" in http*) URL="$PDF";; *) URL="https://www.quebec.ca$PDF";; esac
          curl -sL --max-time 120 -o modalites.pdf "$URL"
          pdftotext -layout modalites.pdf modalites.txt || true
          echo "=== ECO MODALITES OCTROI ==="
          grep -n -i -B2 -A40 "octroi des aides" modalites.txt | head -160
          echo "=== ECO MONTANTS VEHICULES ==="
          grep -n -i -B3 -A12 "pile à combustible\|propulsion électrique" modalites.txt | head -140

      - name: PAVÉ — page Overview (montants des incitatifs)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://tc.canada.ca/en/road-transportation/innovative-technologies/electric-vehicles/electric-vehicle-affordability-program" -o pave.html
          echo "=== PAVE LIENS ==="
          grep -oE 'href="[^"]*affordability[^"]*"' pave.html | sort -u | head -20
          OV=$(grep -oE 'href="[^"]*affordability-program/[a-z-]+"' pave.html | sed 's/href="//;s/"$//' | grep -v "^$" | head -1)
          echo "Overview: $OV"
          case "$OV" in http*) URL="$OV";; *) URL="https://tc.canada.ca$OV";; esac
          curl -sL --max-time 60 "$URL" -o paveov.html
          echo "=== PAVE OVERVIEW ==="
          python3 -c "import re,html;t=open('paveov.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>','',t,flags=re.S);t=re.sub(r'<style.*?</style>','',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);print(t[:8000])"

      - name: ECCC — coût social des GES (tableaux de valeurs)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://www.canada.ca/en/environment-climate-change/services/climate-change/science-research-data/social-cost-ghg.html" -o scc.html
          echo "=== SCC VALEURS ==="
          python3 - << 'PY'
          import re, html
          t = open('scc.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'<script.*?</script>', '', t, flags=re.S)
          t = re.sub(r'<style.*?</style>', '', t, flags=re.S)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          t = re.sub(r'\s+', ' ', t)
          i = t.find('estimate')
          for kw in ['2020 dollars', 'per tonne', '$266', '$247', '$261', 'central estimate']:
              j = t.find(kw)
              if j > 0:
                  print(f'--- autour de « {kw} » ---')
                  print(t[max(0, j-600):j+900])
                  break
          print(t[6000:14000])
          PY

      - name: ECCC — intensité réseau électrique Québec (g CO2e/kWh)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://www.canada.ca/fr/services/environnement/meteo/changementsclimatiques/plan-climatique/electricite-propre/apercu-quebec.html" -o qcgrid.html
          echo "=== QC GRID INTENSITE ==="
          python3 - << 'PY'
          import re, html
          t = open('qcgrid.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'<script.*?</script>', '', t, flags=re.S)
          t = re.sub(r'<style.*?</style>', '', t, flags=re.S)
          t = html.unescape(re.sub(r'<[^>]+>', ' ', t))
          t = re.sub(r'\s+', ' ', t)
          for kw in ['intensité', 'g d’éq', "g d'éq", 'kWh']:
              for m in re.finditer(kw, t):
                  print('---')
                  print(t[max(0, m.start()-400):m.start()+500])
                  break
          PY

      - name: Québec — Guide de quantification GES (facteurs diesel CO2/CH4/N2O)
        continue-on-error: true
        run: |
          curl -sL --max-time 180 -o guide.pdf "https://www.environnement.gouv.qc.ca/changements/ges/guide-quantification/guide-quantification-ges.pdf"
          ls -la guide.pdf; file guide.pdf || true
          pdftotext -layout guide.pdf guide.txt || true
          echo "=== GUIDE QC FACTEURS DIESEL ==="
          grep -n -i -B4 -A14 "carburant diesel" guide.txt | head -160
          echo "=== GUIDE QC VEHICULES LOURDS ==="
          grep -n -i -B2 -A10 "lourds" guide.txt | head -120

      - name: FTCZE — Infrastructure Canada (URL alternative)
        continue-on-error: true
        run: |
          curl -sL --max-time 60 "https://infrastructure.gc.ca/zero-emissions-trans-zero-emissions/index-fra.html" -o ftcze.html || curl -sLk --max-time 60 "https://logement-infrastructure.canada.ca/zero-emissions-trans-zero-emissions/index-fra.html" -o ftcze.html
          echo "=== FTCZE ==="
          python3 -c "import re,html;t=open('ftcze.html',encoding='utf-8',errors='ignore').read();t=re.sub(r'<script.*?</script>','',t,flags=re.S);t=re.sub(r'<style.*?</style>','',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);print(t[:7000])"

      - name: Hydro-Québec — Tarifs d'électricité 2026 (texte complet, tarif M détails)
        continue-on-error: true
        run: |
          curl -sL --max-time 120 -o tarifs.pdf "https://www.hydroquebec.com/data/documents-donnees/pdf/tarifs-electricite.pdf"
          pdftotext -layout tarifs.pdf tarifs.txt || true
          echo "=== HQ TARIF M PUISSANCE A FACTURER ==="
          grep -n -i -B2 -A10 "puissance à facturer\|puissance minimale à facturer" tarifs.txt | head -100
