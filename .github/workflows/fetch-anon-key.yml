name: Fetch anon key (temporaire)

# Workflow TEMPORAIRE : extrait la clé PUBLIQUE anon du bundle JS du site
# Lovable publié. Cette clé est publique par conception. Supprimé après usage.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extraire la clé publique du bundle
        run: |
          set -e
          BASE=https://fleet-future-planner.lovable.app
          curl -sL "$BASE/" -o index.html
          echo "=== taille index.html: $(wc -c < index.html) ==="
          echo "=== balises script/link ==="
          grep -oE '<(script|link)[^>]*>' index.html | head -20
          echo "=== toutes les refs .js/.css ==="
          REFS=$(grep -oE '(src|href)="[^"]+\.(js|mjs)"' index.html | sed -E 's/(src|href)="//; s/"$//' | sort -u)
          echo "$REFS"
          echo "=== extraction ==="
          for ref in $REFS; do
            case "$ref" in
              http*) url="$ref" ;;
              /*) url="$BASE$ref" ;;
              *) url="$BASE/$ref" ;;
            esac
            echo "--- $url ---"
            curl -sL "$url" -o chunk.js || continue
            grep -oE 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' chunk.js | sort -u | head -3 || true
            grep -oE 'sb_publishable_[A-Za-z0-9_-]+' chunk.js | sort -u | head -3 || true
            grep -oE 'supabase[a-z.]*co' chunk.js | sort -u | head -2 || true
          done
          echo "=== fin ==="
