name: Deploy Pages

# Site de test réel (l'aperçu claude.ai ne peut pas atteindre Supabase).
# URL : https://maelmouatasim-beep.github.io/vraih2fleet/

on:
  push:
    branches: ["claude/code-integration-site-o88hza"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Projet Supabase du site de test : trois VARIABLES du dépôt (valeurs
      # publiques, inlinées dans le bundle de toute façon) — Settings →
      # Secrets and variables → Actions → Variables. Plus aucune lecture du
      # bundle Lovable. Variable absente : pas de déploiement (le site en
      # ligne reste tel quel), avertissement dans le run.
      - name: Variables Supabase du dépôt
        id: cfg
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          manquantes=""
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PROJECT_ID VITE_SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || manquantes="$manquantes $v"
          done
          if [ -n "$manquantes" ]; then
            echo "::warning::Site de test NON redéployé — variables de dépôt manquantes :$manquantes (docs/deploiement.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$VITE_SUPABASE_URL" != "https://$VITE_SUPABASE_PROJECT_ID.supabase.co" ]; then
            echo "::error::VITE_SUPABASE_URL ($VITE_SUPABASE_URL) ne correspond pas à VITE_SUPABASE_PROJECT_ID"
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (hash routing, base /vraih2fleet/)
        if: steps.cfg.outputs.ok == 'true'
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PREVIEW_HASH_ROUTER: "true"
          VITE_EMAILS_ACTIVE: ${{ vars.VITE_EMAILS_ACTIVE }}
        run: npx vite build --base=/vraih2fleet/

      - uses: actions/configure-pages@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          path: dist

      - id: deployment
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
