name: Deploy Pages

# Site de test réel (l'aperçu claude.ai ne peut pas atteindre Supabase).
# URL : https://maelmouatasim-beep.github.io/vraih2fleet/

on:
  push:
    branches: ["claude/code-integration-site-o88hza"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # La clé anon est PUBLIQUE (servie à tout visiteur du site Lovable).
      # Priorité à la variable de dépôt si définie ; sinon on la lit dans le
      # bundle public du site Lovable déployé. Jamais affichée dans les logs
      # (add-mask), jamais committée.
      - name: Récupérer la clé publique anon
        id: anonkey
        run: |
          KEY="${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          if [ -z "$KEY" ]; then
            BASE=https://fleet-future-planner.lovable.app
            JS=$(curl -sL "$BASE/" | grep -oE '/assets/index-[^"]*\.js' | head -1)
            KEY=$(curl -sL "$BASE$JS" | grep -oE 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' | head -1)
          fi
          if [ -z "$KEY" ]; then
            echo "Clé anon introuvable (ni variable de dépôt, ni bundle Lovable)" >&2
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build (hash routing, base /vraih2fleet/)
        env:
          # Valeurs publiques (inlinées dans le bundle de toute façon).
          VITE_SUPABASE_PROJECT_ID: fihklznbfufhowopwwuc
          VITE_SUPABASE_URL: https://fihklznbfufhowopwwuc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.anonkey.outputs.key }}
          VITE_PREVIEW_HASH_ROUTER: "true"
        run: npx vite build --base=/vraih2fleet/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
